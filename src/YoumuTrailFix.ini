[AutoTrail]
; orgininally enabled
Enabled=1
; originally mode 2, which is almost invisible
; -1 to keep mode unchanged
BlendMode=2

[RenderFix]
; fix incorrect trail sprite color if not in stage#16
Enabled=1
; global color multiplier, could adjust alpha
; defaultly 0x40ffffff
Color=0x40ffffff

; customize youmu's 6d trail and make it more visible
[Youmu6DTrail]
; orgininally enabled
Enabled=1
; trail interval, originally 4
Step=4
; masking channels of original sprite. (order: A/R/G/B). Non-zero alpha gets you overflowed opacity
; originally 0x00ffff00
Color=0x00ffff00



[Others]
; always enable trail for all characters
Debug=0
; fit decerlerated or paused frame that do not update
TryFitRivDecerlerate=1
; enable rainbow feature (testing)
Sandevistan=0

